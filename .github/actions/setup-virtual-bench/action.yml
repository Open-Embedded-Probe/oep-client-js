name: Set up pinned virtual probe
description: Install an isolated test backend and require it in the JavaScript suite
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - uses: astral-sh/setup-uv@v6
    - run: uv sync --project test/virtual-bench --locked
      shell: bash
    - run: |
        echo "OEP_PYTHON=$GITHUB_WORKSPACE/test/virtual-bench/.venv/bin/python" >> "$GITHUB_ENV"
        echo "OEP_REQUIRE_VIRTUAL_BENCH=1" >> "$GITHUB_ENV"
      shell: bash
