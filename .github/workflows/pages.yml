name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # the page serves the latest oep-probe-arduino Release's firmware: rebuilt once a day to pick a new Release up
  # (or by hand, workflow_dispatch, right after one)
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-virtual-bench
      - run: npm ci
      - run: npm run check
      - run: npm run build:site
      - name: The latest oep-probe-arduino Release's firmware beside the page (scripts/fetch-firmware.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-firmware.js
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
