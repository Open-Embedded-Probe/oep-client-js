name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # a new oep-probe-arduino Release: its Firmware workflow sends this (the page serves the latest Release's firmware)
  repository_dispatch:
    types: [firmware-released]
  schedule:
    - cron: '17 3 * * *'   # and once a day, should a dispatch be missed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: ./.github/actions/setup-virtual-bench
      - run: npm ci
      - run: npm run check
      - run: npm run build:site
      - name: The latest oep-probe-arduino Release's firmware beside the page (scripts/fetch-firmware.js)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/fetch-firmware.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
