name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: ./.github/actions/setup-virtual-bench
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run types
      - run: npm run smoke:dist
      - run: npm run build:site
      - run: npm pack --dry-run
