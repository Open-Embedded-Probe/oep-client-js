name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: ./.github/actions/setup-virtual-bench
      - run: npm ci
      - run: npm run check
      - run: npm run test:browser
      - run: npm run build:site
